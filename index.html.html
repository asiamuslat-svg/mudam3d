<title>مُدام ثلاثي الأبعاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: full-bleed 3D viewport; feature rail on the start (right) edge; scenario bar bottom; live HUD bottom-start. Deliberate single dark look: night-lit mosque. */
:root{
  --ink:#08171a; --ink2:#0f2327; --panel:rgba(10,28,32,.82); --line:rgba(232,220,192,.16);
  --sand:#e9dcc0; --sand-dim:#b9ae96; --brass:#dba847; --cyan:#58d3dc;
  --ok:#3fd08f; --warn:#f3b94d; --bad:#f0605d;
  --display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--sand);font-family:var(--body);font-size:14px;overflow:hidden}
#app{position:relative;height:100%;width:100%;direction:rtl}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.brand{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.brand h1{margin:0;font-family:var(--display);font-size:30px;line-height:1;color:var(--brass);letter-spacing:.5px}
.brand p{margin:4px 0 0;font-size:12px;color:var(--sand-dim);max-width:260px;line-height:1.5}
.brand b{font-family:var(--body);font-weight:600;color:var(--sand);letter-spacing:2px;font-size:11px}

.rail{position:absolute;top:84px;right:max(16px,env(safe-area-inset-right,0px));bottom:92px;width:236px;display:flex;flex-direction:column;gap:6px;z-index:6;overflow-y:auto;padding-left:4px;scrollbar-width:thin}
.feat{display:flex;align-items:center;gap:10px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:500;backdrop-filter:blur(8px);transition:border-color .2s,background .2s}
.feat:hover{border-color:rgba(219,168,71,.6)}
.feat[aria-pressed="true"]{border-color:var(--brass);background:rgba(219,168,71,.14)}
.feat i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brass);color:#1b1304;font-style:normal;font-weight:700;font-size:12px;display:grid;place-items:center}
.feat small{display:block;color:var(--sand-dim);font-size:11px;font-weight:400;margin-top:1px}

.card{position:absolute;top:84px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 248px);width:min(340px,calc(100vw - 300px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px;backdrop-filter:blur(10px);z-index:6;line-height:1.7}
.card[hidden]{display:none!important}
.card h2{margin:0 0 6px;font-family:var(--display);font-size:20px;color:var(--brass)}
.card p{margin:0 0 8px;color:var(--sand)}
.card ul{margin:0;padding:0 18px 0 0;color:var(--sand-dim);font-size:13px}
.card .tag{display:inline-block;font-size:11px;letter-spacing:.3px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;margin:6px 0 0 6px;color:var(--cyan);direction:ltr}
.card .x{position:absolute;top:8px;left:8px;background:none;border:0;font-size:18px;color:var(--sand-dim);width:28px;height:28px}

.bar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:7;max-width:calc(100vw - 32px);overflow-x:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px)}
.bar button{flex:none;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.bar button:hover{background:rgba(233,220,192,.08)}
.bar button[aria-pressed="true"]{background:var(--brass);color:#1b1304;font-weight:700}
.bar button.danger[aria-pressed="true"]{background:var(--bad);color:#fff}
.bar .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

.hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:84px;width:228px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:5;backdrop-filter:blur(10px);direction:rtl}
.hud h3{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--sand-dim)}
.hud dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.hud dt{color:var(--sand-dim)}
.hud dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;direction:rtl}
.pill.ok{background:rgba(63,208,143,.18);color:var(--ok)}
.pill.warn{background:rgba(243,185,77,.18);color:var(--warn)}
.pill.bad{background:rgba(240,96,93,.2);color:var(--bad)}

.pip{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:84px;width:260px;height:158px;border:1px solid var(--line);border-radius:10px;z-index:4;pointer-events:none;overflow:hidden}
.pip span{position:absolute;top:6px;right:8px;font-size:10px;letter-spacing:.5px;color:var(--cyan);background:rgba(8,23,26,.7);padding:1px 6px;border-radius:4px;direction:ltr}
#pipov{position:absolute;inset:0;width:100%;height:100%}

.toast{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;min-width:260px;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;font-weight:600;text-align:center;border:1px solid transparent}
.toast[hidden]{display:none!important}
.toast.bad{background:rgba(120,24,24,.92);border-color:var(--bad);color:#fff}
.toast.warn{background:rgba(110,76,12,.92);border-color:var(--warn);color:#fff}
.toast.ok{background:rgba(14,80,52,.92);border-color:var(--ok);color:#fff}
.toast small{display:block;font-weight:400;opacity:.85;margin-top:2px}

.hot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid var(--brass);background:rgba(8,23,26,.85);color:var(--brass);font-weight:700;font-size:12px;display:grid;place-items:center;pointer-events:auto;z-index:3;padding:0;box-shadow:0 0 0 4px rgba(219,168,71,.18)}
.hot[aria-pressed="true"]{background:var(--brass);color:#1b1304}
.hot[hidden]{display:none!important}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:20;text-align:center}
.loading b{font-family:var(--display);font-size:40px;color:var(--brass);display:block}
.loading.done{display:none}

@media (max-width:820px){
  .brand p{display:none}
  .rail{top:auto;bottom:66px;left:0;right:0;width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 max(16px,env(safe-area-inset-right,0px));z-index:7}
  .feat{flex:none;width:auto;white-space:nowrap}
  .feat small{display:none}
  .card{top:auto;bottom:122px;right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:34vh;overflow-y:auto}
  .hud{bottom:auto;top:56px;left:max(16px,env(safe-area-inset-left,0px));width:150px;padding:8px 10px}
  .hud dl{font-size:12px}
  .pip{display:none}
  .bar{bottom:max(10px,env(safe-area-inset-bottom,0px))}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="loading" id="loading"><div><b>مُدام</b><span>جارٍ تجهيز المجسم…</span></div></div>
  <canvas id="gl" aria-label="مجسم ثلاثي الأبعاد لمسجد مُدام الذكي"></canvas>
  <canvas id="ov"></canvas>
  <div id="hots"></div>

  <header class="brand"><h1>مُدام</h1><b>MUDAM</b><p>منصة المسجد الذكي المستدام: رؤية حاسب، إنترنت الأشياء، وتحليل بيانات</p></header>

  <nav class="rail" id="rail" aria-label="مميزات المنصة"></nav>
  <section class="card" id="card" hidden aria-live="polite"></section>

  <div class="pip" id="pip"><canvas id="pipov"></canvas><span>EDGE CAM · 120° · RPi 5</span></div>

  <aside class="hud" aria-label="القراءات المباشرة">
    <h3>القراءات المباشرة</h3>
    <dl>
      <dt>المصلون</dt><dd id="h-n">0 / 72</dd>
      <dt>الصفوف</dt><dd id="h-rows" style="direction:rtl">—</dd>
      <dt>حرارة القاعة</dt><dd id="h-t">—</dd>
      <dt>التكييف</dt><dd id="h-ac" style="direction:rtl">—</dd>
      <dt>القدرة</dt><dd id="h-kw">—</dd>
      <dt>توفير الطاقة</dt><dd id="h-save">—</dd>
      <dt>MQ-2 دخان</dt><dd id="h-mq">—</dd>
      <dt>الحالة</dt><dd id="h-st" style="direction:rtl">—</dd>
    </dl>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <div class="bar" id="bar" role="toolbar" aria-label="السيناريوهات وخيارات العرض"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('loading').innerHTML='<div>تعذّر تحميل مكتبة العرض ثلاثي الأبعاد</div>';return;}
const T=THREE;

/* ---------- Content ---------- */
const FEATURES=[
 {id:'count',n:1,t:'عدّ المصلين وتنظيم الصفوف',s:'YOLO · شاشة المدخل',cam:[-3,7.5,15.5,0,1.2,1],hot:[0,4.9,6.9],
  p:'كاميرا واحدة في أعلى الجدار الخلفي تلتقط إطارًا كل 5 ثوانٍ، وخوارزمية YOLO تكتشف كل مصلٍّ وتسنده إلى صفّه. كل صف يُصنَّف: ممتلئ، شبه ممتلئ، أو فارغ.',
  l:['شاشة المدخل تعرض الصفوف بثلاثة ألوان وتُظهر أقرب صف شاغر','أول صفوف المسجد تكتمل أولًا','تُسوّى القراءات بوسيط آخر ثلاثة إطارات'],g:'YOLO · OpenCV · Raspberry Pi 5',vision:true},
 {id:'fall',n:2,t:'كشف السقوط',s:'تمييز السقوط عن السجود',cam:[9,5.5,8,-1,.5,-1.4],hot:[3.2,1.2,-1.1],
  p:'يستخرج النموذج 17 نقطة في جسم كل شخص. إذا هبط شخص واحد فجأة وبقي على الأرض أكثر من 20 ثانية، يصل تنبيه للقائم على المسجد مع رقم الصف.',
  l:['انخفاض الصف كاملًا معًا يعني سجودًا ويُتجاهل','الأولوية للاستدعاء (Recall) لأن تفويت السقوط أخطر من إنذار كاذب','الهدف: Recall ≥ 0.90 وتنبيه خلال ≤ 10 ثوانٍ'],g:'Pose · 17 keypoints',vision:true},
 {id:'fire',n:3,t:'كشف الحريق والدخان',s:'إشارتان: كاميرا + MQ-2',cam:[-3,6,11,-7,1.5,3.5],hot:[-8,1.6,4.2],
  p:'يؤكَّد الحريق عند اتفاق إشارتين مستقلتين: الكاميرا ترى اللهب والدخان، وحساس MQ-2 يقيس الدخان والغاز. إشارة واحدة عالية تعطي تحذيرًا فقط.',
  l:['تُرفع القراءة الحرجة من الحساس وحدها إلى طوارئ','نماذج مدرَّبة على D-Fire مع صور سلبية صعبة: المصابيح والسجاد الأحمر وبخور العود','تدعم المنصة إنذار الحريق المعتمد ولا تحل محله'],g:'YOLO · MQ-2 + ADS1115',vision:true},
 {id:'ac',n:4,t:'التحكم الذكي بالتكييف',s:'Broadlink RM4 mini',cam:[-12,5.5,9,0,3.6,2],hot:[3.6,2.5,6.7],
  p:'متحكم الأشعة تحت الحمراء يتحكم بالمكيفات الحالية دون تغيير تمديدات. يبرّد القاعة قبل الصلاة بحسب الحضور المتوقع، ويضبط الحرارة حسب عدد المصلين، ويطفئ عند خلو القاعة 15 دقيقة.',
  l:['التبريد المسبق: زمن التقدم يكبر مع الحضور المتوقع وحرارة الخارج','أكثر من نصف القاعة: حرارة أقل ضمن نطاق الراحة','الطوارئ والتحكم اليدوي لهما الأولوية دائمًا'],g:'IR · قواعد صريحة وليس نموذجًا متعلَّمًا'},
 {id:'fri',n:5,t:'وضع صلاة الجمعة',s:'تنبؤ + تبريد تدريجي',cam:[12,9,13,0,1.5,0],hot:[-4.5,4.6,-6.9],
  p:'كل جمعة يتحول النظام تلقائيًا لوضع الجمعة: تتنبأ الخوارزمية بالحضور ليلة الخميس، يبدأ التبريد أبكر، ويرتفع على مراحل عند 30٪ و70٪ من الإشغال، ثم يُطفأ بعد خروج المصلين.',
  l:['الجلوس الطويل أثناء الخطبة لا يُعدّ سقوطًا ولا قاعة فارغة','Random Forest + متحكم بتأخير (Hysteresis) لتجنب التشغيل والإطفاء المتكرر','يتعلم من منحنى الوصول الفعلي كل أسبوع'],g:'Random Forest · Hysteresis'},
 {id:'energy',n:6,t:'قياس الطاقة والاستدامة',s:'Shelly EM',cam:[14,5,12,8,2.2,5],hot:[8.7,2.2,4.8],
  p:'عداد الطاقة يقيس كهرباء المكيفات والإضاءة، ينبّه إذا عملت في قاعة فارغة، ويحسب الطاقة والتكلفة الموفَّرة مقارنة بفترة الأساس.',
  l:['مؤشر: الطاقة لكل مصلٍّ ولكل صلاة','يدعم أهداف رؤية 2030 والمبادرة السعودية الخضراء','دراسة مرجعية: الإشغال الذكي يخفض استهلاك المساجد 16–21٪'],g:'Shelly EM · قياس ومقارنة'},
 {id:'priv',n:7,t:'الخصوصية بالتصميم',s:'لا صور مخزَّنة · لا وجوه',cam:[0,9,17,0,2,5],hot:[0,4.2,6.9],
  p:'تُحلَّل الفيديوهات داخل وحدة الحافة فقط ويُحذف كل إطار فورًا. لا صورة تُخزَّن أو تُرسَل، ولا يُتعرَّف على الوجوه، وتُحفظ الأعداد والأحداث فقط.',
  l:['الكاميرا ترى الصفوف من الخلف','لا كاميرات في دورات المياه ومواضع الوضوء','متوافق مع نظام حماية البيانات الشخصية وضوابط كاميرات المراقبة'],g:'Edge-only · Privacy by design',privacy:true},
 {id:'dash',n:8,t:'اللوحة والتنبيهات والتنبؤ',s:'PWA · MQTT · التصعيد',cam:[-14,12,20,2,5,-1],hot:[15.5,5.4,-2],
  p:'تُرسَل الرسائل بـ MQTT إلى خادم FastAPI وقاعدة PostgreSQL/TimescaleDB، وتظهر في تطبيق ويب واحد يعمل على الحاسوب والجوال مع إشعارات فورية.',
  l:['ثلاثة مستويات: طوارئ، تحذير، معلومة','الطوارئ تصل للقائم والمدير، وبلا إقرار خلال 60 ثانية تنتقل لجهة الاتصال التالية، ويمكن الاتصال بالدفاع المدني 998 بنقرة','تنبؤ بالحضور والطاقة وأعطال المكيفات (Isolation Forest)'],g:'FastAPI · React PWA · scikit-learn',cloud:true}
];

/* ---------- Scene setup ---------- */
const canvas=document.getElementById('gl');
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setClearColor(0x08171a);
renderer.shadowMap.enabled=false;
renderer.outputEncoding=T.sRGBEncoding;
const scene=new T.Scene();
scene.fog=new T.Fog(0x08171a,45,110);
const cam=new T.PerspectiveCamera(42,1,.1,300);
const pipCam=new T.PerspectiveCamera(70,260/158,.05,60);
pipCam.position.set(0,4.4,6.85);pipCam.lookAt(0,1.0,-3);

/* custom orbit */
const orb={target:new T.Vector3(0,1.5,0),theta:0,phi:1.0,r:25,tt:new T.Vector3(0,1.5,0),ttheta:0.0,tphi:1.0,tr:25,tour:false};
function setOrbFromPos(px,py,pz,tx,ty,tz){const dx=px-tx,dy=py-ty,dz=pz-tz;const r=Math.hypot(dx,dy,dz);orb.tt.set(tx,ty,tz);orb.tr=r;orb.tphi=Math.acos(Math.min(1,Math.max(-1,dy/r)));orb.ttheta=Math.atan2(dx,dz);
  // choose shortest angular path
  let d=orb.ttheta-orb.theta;d=Math.atan2(Math.sin(d),Math.cos(d));orb.ttheta=orb.theta+d;}
setOrbFromPos(-6,11,22,0,1.2,0);orb.theta=orb.ttheta;orb.phi=orb.tphi;orb.r=orb.tr;orb.target.copy(orb.tt);
let drag=null,pinch=null,lastInput=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,id:e.pointerId,pts:new Map()};drag.pts.set(e.pointerId,[e.clientX,e.clientY]);lastInput=performance.now();stopTour();});
canvas.addEventListener('pointermove',e=>{if(!drag)return;drag.pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(drag.pts.size===2){const a=[...drag.pts.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch){orb.tr=clamp(orb.tr*pinch/d,6,55);orb.r=orb.tr;}pinch=d;return;}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  orb.ttheta-=dx*0.006;orb.tphi=clamp(orb.tphi-dy*0.006,0.15,1.52);orb.theta=orb.ttheta;orb.phi=orb.tphi;lastInput=performance.now();});
const endp=e=>{if(drag){drag.pts.delete(e.pointerId);if(drag.pts.size<2)pinch=null;if(drag.pts.size===0)drag=null;}};
canvas.addEventListener('pointerup',endp);canvas.addEventListener('pointercancel',endp);
canvas.addEventListener('wheel',e=>{e.preventDefault();orb.tr=clamp(orb.tr*(1+e.deltaY*0.001),6,55);lastInput=performance.now();stopTour();},{passive:false});
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}

/* ---------- Materials ---------- */
const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:.05},o));
const mat={
 stone:M(0xe0d2b4,{roughness:.9}), stoneDark:M(0xb9a982), floor:M(0x15393c,{roughness:.95}),
 carpet:M(0x1c4a4a,{roughness:1}), gold:M(0xdba847,{metalness:.6,roughness:.35}), white:M(0xf3efe4,{roughness:.7}),
 wall:new T.MeshStandardMaterial({color:0xd9c9a6,roughness:.9,transparent:true,opacity:.16,depthWrite:false,side:T.DoubleSide}),
 roof:new T.MeshStandardMaterial({color:0xcdbd98,roughness:.85,transparent:true,opacity:0,depthWrite:false,side:T.DoubleSide}),
 dome:new T.MeshStandardMaterial({color:0x2c8a82,roughness:.45,metalness:.25,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false}),
 black:M(0x10171a,{roughness:.5}), cyanE:new T.MeshBasicMaterial({color:0x58d3dc}),
 glow:new T.MeshBasicMaterial({color:0xffe3a3})
};
const mats=[mat.wall,mat.roof,mat.dome];

/* lights */
scene.add(new T.HemisphereLight(0xcfe6e8,0x10272a,.55));
const sun=new T.DirectionalLight(0xfff0d0,.55);sun.position.set(14,26,10);scene.add(sun);
const hallLights=[];
[[-5,5.2,-3],[5,5.2,-3],[-5,5.2,3],[5,5.2,3]].forEach(p=>{const l=new T.PointLight(0xffd79a,.0,22,1.6);l.position.set(...p);scene.add(l);hallLights.push(l);});
const fireLight=new T.PointLight(0xff6a22,0,10,1.6);fireLight.position.set(-8,1.2,4);scene.add(fireLight);

const CY=[[0,6,'q'],[6,8,'r'],[8,9.5,'q'],[9.5,12,'s'],[12,14,'j'],[14,16.5,'s']];
function poseAt(t){
  t=((t%16.5)+16.5)%16.5;let k='q';for(const s of CY){if(t>=s[0]&&t<s[1]){k=s[2];break;}}
  switch(k){case 'q':return{leg:1,y:.85,bend:0,h:1.95};case 'r':return{leg:1,y:.85,bend:-1.5,h:1.3};case 's':return{leg:.34,y:.3,bend:-1.45,h:.55,sj:true};case 'j':return{leg:.34,y:.34,bend:-.05,h:1.25,sj:true};}
}

/* ---------- Simulation ---------- */
let time=0,statTimer=0;
function update(dt){
  time+=dt;
  // presence by target %
  const want=Math.round(S.target/100*N);
  // presence changes gradually
  const cur=people.filter(p=>p.present).length;
  if(cur<want){for(let i=0;i<order.length&&people.filter(p=>p.present).length<want;i++){const p=people[order[i]];if(!p.present){p.present=true;break;}}}
  else if(cur>want){for(let i=order.length-1;i>=0;i--){const p=people[order[i]];if(p.present&&S.fallIdx!==order[i]){p.present=false;break;}}}
  S.n=people.filter(p=>p.present).length;

  // fall scenario
  if(S.scenario==='fall'){
    S.fallT+=dt;
    if(S.fallT>2.5&&S.fallIdx<0){ // pick a person in row 3 (index 2) who is present
      const cand=people.filter(p=>p.present&&p.row===2);const pick=cand[Math.floor(cand.length/2)]||people.find(p=>p.present);
      if(pick){S.fallIdx=people.indexOf(pick);S.fallRow=pick.row;pick.fallTarget=1;S.fall=true;S.fallStart=S.fallT;}
    }
    if(S.fall){
      const dtf=S.fallT-S.fallStart;
      if(dtf<1.6)S.alertLevel=0;
      else if(dtf<5){S.alertLevel=2;}
      if(dtf>=5&&S.alertLevel<3){S.alertLevel=3;showToast('bad','تنبيه طوارئ: سقوط مصلٍّ في الصف '+toNum(S.fallRow+1),'وصل التنبيه للقائم والمدير · يُصعَّد بعد ٦٠ ثانية دون إقرار',0);}
    }
  }
  // fire scenario
  if(S.scenario==='fire'){
    S.fireT+=dt;fireG.visible=true;
    const mqTarget=S.fireT<2?12:(S.fireT<5?60+(S.fireT-2)*70:260+Math.min(S.fireT-5,6)*40);
    S.mq=lerp(S.mq,mqTarget,.04);
    S.fireSig=S.fireT>3;
    if(S.fireT>3&&S.alertLevel<2){S.alertLevel=2;showToast('warn','تحذير: إشارة واحدة عالية','الكاميرا ترى لهبًا · بانتظار تأكيد الحساس',0);}
    if(S.fireT>5.5&&S.alertLevel<3){S.alertLevel=3;showToast('bad','طوارئ: حريق مؤكَّد بإشارتين','الكاميرا + MQ-2 متفقان · إنذار فوري للقائم والمدير، واتصال بالدفاع المدني 998 بنقرة',0);}
  }else{fireG.visible=false;S.mq=lerp(S.mq,12,.05);S.fireSig=false;}
  if(S.scenario!=='fall'&&S.scenario!=='fire')S.alertLevel=0;

  // temperature / AC / energy model
  const occ=S.n/N;
  let setT,acOn=S.acOn,pwr=0;
  if(S.scenario==='empty'){S.emptyT+=dt;if(S.emptyT>6){acOn=false;}} else S.emptyT=0;
  if(S.fire&&S.alertLevel>=3){acOn=false;}
  S.acActive=acOn;
  const stage=S.fire&&S.alertLevel>=3?0:(S.scenario==='empty'?(acOn?1:0):(S.mode==='friday'?(occ>.7?3:(occ>.3?2:1)):(S.mode==='pre'?2:(occ>.5?2:1))));
  S.stageNow=stage;
  setT=[31,26,24.5,23][stage];
  S.roomT=lerp(S.roomT,acOn?setT:S.outT-3,dt*(acOn?.12:.02));
  pwr=acOn?[0,3.2,5.4,7.6][stage]:0;pwr+=occ>0||S.scenario!=='empty'?1.1*(occ>0?1:0.3):0.2;
  S.kw=lerp(S.kw,pwr,dt*.8);
  const base=9.4; // baseline fixed schedule kW
  S.saved=lerp(S.saved,clamp((1-S.kw/base)*100,0,60),dt*.6);

  // people animation
  const sit=S.mode==='friday';
  people.forEach((p,i)=>{
    // scale in/out
    const ts=p.present?1:0;p.sc=lerp(p.sc,ts,clamp(dt*4,0,1));p.root.visible=p.sc>.02;p.root.scale.setScalar(Math.max(.001,p.sc));
    // fall
    p.fallen=lerp(p.fallen,p.fallTarget,clamp(dt*(p.fallTarget?5:3),0,1));
    p.marker.material.opacity=p.fallen>.5?(.45+.4*Math.sin(time*7)):0;
    if(p.fallen>.02){ // lie down on side
      p.root.rotation.z=-p.fallen*1.5;p.root.position.y=p.fallen*.22;p.root.rotation.x=0;
      p.legs.scale.y=lerp(p.legs.scale.y,1,.2);p.up.rotation.x=lerp(p.up.rotation.x,0,.2);p.up.position.y=lerp(p.up.position.y,.85,.2);p.pose={h:.6};
    }else{
      p.root.rotation.z=0;p.root.position.y=0;
      let po;
      if(sit&&S.prayer===false)po=poseFriday();
      else if(S.scenario==='empty'||!S.prayer&&S.mode!=='friday')po={leg:1,y:.85,bend:0,h:1.95};
      else po=poseAt(time+p.row*0.0+0); // whole row (and hall) moves together; same for everyone in a prayer
      if(S.scenario==='pre')po={leg:1,y:.85,bend:0,h:1.95};
      applyPose(p,po,clamp(dt*6,0,1));
    }
  });
  // Friday: after a while the hall stands and prays together (alternate)
  if(S.mode==='friday'){const c=time%40;S.prayer=c>22;}else if(S.scenario==='normal'||S.scenario==='fall'||S.scenario==='fire'){S.prayer=true;}
  // row counts & nearest free row
  const counts=Array(ROWS).fill(0);people.forEach(p=>{if(p.present&&p.fallen<.5||p.present&&p.fallen>=.5)counts[p.row]++;});
  nearest=-1;for(let r=0;r<ROWS;r++){if(counts[r]<PER){nearest=r;break;}}
  rowStrips.forEach((s,r)=>{const st=rowState(counts[r]);s.material.color.set(st===2?0xf0605d:(st===1?0xf3b94d:0x3fd08f));s.material.opacity=.22+(nearest===r?.14*Math.sin(time*4)+.05:0);});
  if(nearest>=0&&S.n<N){hiRow.position.z=rowZ[nearest];hiRow.material.opacity=.14+.08*Math.sin(time*4);hiRow.visible=true;}else hiRow.visible=false;

  // lights by presence (3 zones)
  const zoneOn=[occ>0.01||S.mode==='pre'&&true, occ>0.01||S.mode==='pre', occ>0.25||S.mode==='friday'];
  lamps.forEach(l=>{const on=S.scenario==='empty'&&S.emptyT>4?false:zoneOn[l.userData.zone]||S.n>0;l.userData.on=on;l.userData.bulb.material.color.set(on?0xffe3a3:0x4a4636);});
  hallLights.forEach((l,i)=>{const on=lamps.some(x=>x.userData.on);l.intensity=lerp(l.intensity,on?(S.scenario==='fire'?.7:1.1):.15,dt*3);});
  fireLight.intensity=fireG.visible?(1.8+Math.sin(time*18)*.5+Math.random()*.4):0;

  // AC units, particles
  acs.forEach(a=>{a.userData.on=acOn;a.userData.led.material.color.set(acOn?0x58d3dc:0x333333);});
  const posAttr=airGeo.attributes.position;
  for(let i=0;i<airN;i++){
    airLife[i]+=dt;
    if(!acOn){airPos[i*3+1]=-50;continue;}
    if(airLife[i]>3.2||airPos[i*3+1]<.2)respawnAir(i);
    airPos[i*3]+=airVel[i].x*dt;airPos[i*3+1]+=airVel[i].y*dt;airPos[i*3+2]+=airVel[i].z*dt;
    airVel[i].y-=dt*.08;
  }
  posAttr.needsUpdate=true;air.material.opacity=acOn?(.4+.1*stage):0;
  // IR pulses
  const irActive=acOn&&(time%6<1.2);
  irLines.forEach(l=>{l.material.opacity=lerp(l.material.opacity,irActive?.85:0,dt*6);});
  irRings.forEach((r,i)=>{const ph=((time*1.4)+i/3)%1;r.scale.setScalar(.6+ph*3.2);r.material.opacity=acOn?.55*(1-ph):0;});
  blLed.material.color.set(irActive?0xffffff:0xdba847);
  // energy meter display
  emScreen.material.color.set(S.kw>6?0xf3b94d:0x3fd08f);
  // edge led blink
  edgeLed.material.color.set(S.alertLevel>=2?(Math.floor(time*4)%2?0xf0605d:0x4a1b1b):(Math.floor(time*1.5)%2?0x3fd08f:0x1b4a35));
  lensGlow.material.color.set(Math.floor(time*.2)%1===0&&((time%5)<.15)?0xffffff:0x58d3dc);

  // fire
  if(fireG.visible){
    flames.forEach(f=>{f.userData.p+=dt*9;const s=.7+Math.sin(f.userData.p)*.35+Math.min(S.fireT/8,1)*.8;f.scale.set(1,s,1);f.position.y=.5+s*.45;});
    smoke.forEach(m=>{const u=m.userData;u.t+=dt*.5*(0.6+Math.min(S.fireT/6,1));if(u.t>5)u.t=0;
      m.visible=S.fireT>1.5;const k=u.t/5;m.position.set(-8+u.sx*k*3+k*2.2,1+k*5,4+u.sz*k*3);m.scale.setScalar(.6+k*3.4);m.material.opacity=Math.min(.34,S.fireT/18)*(1-k)*Math.min(1,k*8);});
  }else smoke.forEach(m=>{m.visible=false;});

  // data packets
  packets.forEach(p=>{p.userData.t+=dt*.22;if(p.userData.t>1)p.userData.t-=1;routes[p.userData.r].getPoint(p.userData.t,p.position);p.material.color.set(S.alertLevel>=3?0xf0605d:0xdba847);p.scale.setScalar(S.alertLevel>=3?1.4:1);});
  cloud.position.y=15+Math.sin(time*.6)*.25;

  // stats history
  histT+=dt;if(histT>.7){histT=0;hist.push({n:S.n,kw:S.kw});if(hist.length>HN)hist.shift();}
  while(hist.length<HN)hist.unshift({n:0,kw:0});
  statTimer+=dt;
  if(statTimer>.25){statTimer=0;drawEntrance(counts);drawDash(counts);drawPhone();updateHud(counts);}
}
function updateHud(counts){
  const g=id=>document.getElementById(id);
  g('h-n').textContent=S.n+' / '+N;
  const full=counts.filter(c=>rowState(c)===2).length,part=counts.filter(c=>rowState(c)===1).length;
  g('h-rows').textContent=toNum(full)+' ممتلئ · '+toNum(part)+' جزئي';
  g('h-t').textContent=S.roomT.toFixed(1)+' °C';
  g('h-ac').innerHTML=S.acActive?'<span class="pill ok">'+(['','مستوى 1','مستوى 2','مستوى 3'][S.stageNow]||'يعمل')+'</span>':'<span class="pill warn">متوقف</span>';
  g('h-kw').textContent=S.kw.toFixed(1)+' kW';
  g('h-save').textContent='−'+Math.round(S.saved)+' %';
  g('h-mq').textContent=Math.round(S.mq)+' ppm';
  g('h-st').innerHTML=S.alertLevel>=3?'<span class="pill bad">طوارئ</span>':(S.alertLevel===2?'<span class="pill warn">تحذير</span>':'<span class="pill ok">طبيعي</span>');
}

/* ---------- Visibility modes ---------- */
function applyXray(dt){
  const k=clamp(dt*4,0,1);
  const tw=S.xray?.16:.85,tr=S.xray?0:1,td=S.xray?.12:1;
  mat.wall.opacity=lerp(mat.wall.opacity,tw,k);mat.roof.opacity=lerp(mat.roof.opacity,tr,k);mat.dome.opacity=lerp(mat.dome.opacity,td,k);
  mat.wall.depthWrite=!S.xray;mat.roof.depthWrite=!S.xray;
  // hide rear wall when x-ray so inside objects on it still visible
  rearWall.visible=true;
}

/* ---------- Resize / loop ---------- */
function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  ovCanvas.width=w;ovCanvas.height=h;
  const pip=document.getElementById('pip');pipCanvas.width=pip.clientWidth||260;pipCanvas.height=pip.clientHeight||158;
}
addEventListener('resize',resize);

const hotPos=new T.Vector3();
function updateHotspots(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  FEATURES.forEach(f=>{
    hotPos.copy(f.hp);if(f.id!=='dash')bld.localToWorld(hotPos);hotPos.project(cam);
    const vis=hotPos.z<1&&hotPos.x>-1.05&&hotPos.x<1.05&&hotPos.y>-1.05&&hotPos.y<1.05&&S.hot;
    f.hotEl.hidden=!vis;if(vis){f.hotEl.style.left=((hotPos.x*.5+.5)*w)+'px';f.hotEl.style.top=((-hotPos.y*.5+.5)*h)+'px';}
  });
}
const dashOverride=(function(){/* dash hotspot is in world space already */})();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  // auto-orbit when idle & no feature
  if(!drag&&!S.feature&&!orb.tour&&now-lastInput>5000){orb.ttheta+=dt*.07;}
  const k=1-Math.pow(.0009,dt);
  orb.theta=lerp(orb.theta,orb.ttheta,k);orb.phi=lerp(orb.phi,orb.tphi,k);orb.r=lerp(orb.r,orb.tr,k);orb.target.lerp(orb.tt,k);
  const sp=Math.sin(orb.phi);
  cam.position.set(orb.target.x+orb.r*sp*Math.sin(orb.theta),orb.target.y+orb.r*Math.cos(orb.phi),orb.target.z+orb.r*sp*Math.cos(orb.theta));
  cam.lookAt(orb.target);
  update(dt);applyXray(dt);

  const w=canvas.clientWidth,h=canvas.clientHeight;
  renderer.setScissorTest(false);renderer.setViewport(0,0,w,h);renderer.render(scene,cam);
  drawDetections(ovCtx,cam,w,h,1);updateHotspots();

  // PiP edge camera view
  if(S.showVision&&w>820){
    const pip=document.getElementById('pip');const r=pip.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
    const px=Math.round(r.left-cr.left),py=Math.round(cr.bottom-r.bottom),pw=Math.round(r.width),ph=Math.round(r.height);
    const sv=[mat.wall.opacity,mat.roof.opacity,mat.dome.opacity],srw=rearWall.visible,sfov=fov.visible,sg=gridH.visible;
    mat.wall.opacity=.95;mat.roof.opacity=1;mat.dome.opacity=0;rearWall.visible=false;fov.visible=false;air.visible=false;
    renderer.setScissorTest(true);renderer.setViewport(px,py,pw,ph);renderer.setScissor(px,py,pw,ph);
    renderer.render(scene,pipCam);renderer.setScissorTest(false);
    mat.wall.opacity=sv[0];mat.roof.opacity=sv[1];mat.dome.opacity=sv[2];rearWall.visible=srw;fov.visible=sfov;air.visible=true;
    drawDetections(pipCtx,pipCam,pipCanvas.width,pipCanvas.height,.8);
  }
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
buildBar();applyToggles();resize();setScenario('normal');
// pre-fill immediately (no slow ramp at load)
(function(){const want=Math.round(S.target/100*N);for(let i=0;i<want;i++){const p=people[order[i]];p.present=true;p.sc=1;p.root.visible=true;p.root.scale.setScalar(1);}S.roomT=27.5;S.kw=4.0;S.saved=45;})();
syncBar();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{redrawSprites();document.getElementById('loading').classList.add('done');});
setTimeout(()=>document.getElementById('loading').classList.add('done'),2500);
requestAnimationFrame(frame);
if(window.claude&&window.claude.hot&&window.claude.hot.ready){}
})();
</script>
